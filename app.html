<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>council — ask three AIs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#08080A; --surface:#151519; --text:#F3F3F1; --muted:#8B8B90; --line:#242429;
    --accent:#FF3E6C; --gpt:#10A37F; --claude:#D97757; --gemini:#4285F4;
    --f-display:'Bricolage Grotesque','Arial Black',sans-serif;
    --f-body:'Instrument Sans',-apple-system,sans-serif;
    --f-mono:'Space Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--f-body);line-height:1.6;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .wrap{max-width:820px;margin:0 auto;padding:0 22px;}
  nav{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(8,8,10,.8);
    backdrop-filter:blur(8px);z-index:10;}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:60px;}
  .brand{font-family:var(--f-mono);font-weight:700;font-size:1rem;text-decoration:none;color:var(--text);}
  .brand::before{content:"●";color:var(--accent);margin-right:.5em;font-size:.8em;}
  .nav-cta{font-family:var(--f-mono);font-size:.8rem;text-decoration:none;color:var(--text);
    border:1.5px solid var(--accent);padding:8px 16px;border-radius:2px;transition:.18s;}
  .nav-cta:hover{background:var(--accent);color:#08080A;box-shadow:0 0 20px rgba(255,62,108,.5);}

  .stage{text-align:center;padding:40px 0 8px;}
  .eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);margin-bottom:26px;}

  .tri-wrap{position:relative;width:100%;max-width:460px;margin:0 auto;}
  .tri-wrap::before{content:"";position:absolute;inset:8%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,62,108,.28),rgba(139,92,246,.16) 45%,transparent 70%);
    filter:blur(24px);animation:breathe 5s ease-in-out infinite;z-index:0;}
  .triangle{position:relative;z-index:1;width:100%;height:auto;display:block;}
  .tri-line{fill:none;stroke:url(#triGrad);stroke-width:3;stroke-linejoin:round;
    filter:drop-shadow(0 0 7px #FF3E6C) drop-shadow(0 0 18px rgba(255,62,108,.55));
    animation:triPulse 3.4s ease-in-out infinite;}
  .node circle{filter:drop-shadow(0 0 10px currentColor) drop-shadow(0 0 20px currentColor);}
  .node-gpt{color:var(--gpt);} .node-gpt circle{fill:var(--gpt);}
  .node-claude{color:var(--claude);} .node-claude circle{fill:var(--claude);}
  .node-gemini{color:var(--gemini);} .node-gemini circle{fill:var(--gemini);}
  .node text{fill:var(--text);font-family:var(--f-mono);font-weight:700;font-size:15px;}
  @keyframes triPulse{
    0%,100%{filter:drop-shadow(0 0 6px #FF3E6C) drop-shadow(0 0 15px rgba(255,62,108,.45));}
    50%{filter:drop-shadow(0 0 13px #FF3E6C) drop-shadow(0 0 32px rgba(139,92,246,.7)) drop-shadow(0 0 48px rgba(34,211,238,.4));}
  }
  @keyframes breathe{0%,100%{opacity:.7;} 50%{opacity:1;}}

  .ask-area{text-align:center;padding:20px 0 60px;}
  .ask-area h2{font-family:var(--f-display);font-weight:800;font-size:clamp(1.7rem,5vw,2.6rem);
    letter-spacing:-.02em;line-height:1.02;margin-bottom:20px;}
  .ask{display:flex;gap:10px;max-width:640px;margin:0 auto;flex-wrap:wrap;}
  .ask input{flex:1 1 240px;min-width:0;padding:15px 16px;font-size:1rem;font-family:var(--f-body);
    color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:3px;outline:none;}
  .ask input::placeholder{color:var(--muted);}
  .ask input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,62,108,.2),0 0 22px rgba(255,62,108,.25);}
  .ask button{padding:15px 28px;font-family:var(--f-body);font-weight:600;font-size:1rem;color:#08080A;
    background:var(--accent);border:none;border-radius:3px;cursor:pointer;transition:.15s;
    box-shadow:0 0 22px rgba(255,62,108,.4);}
  .ask button:hover:not(:disabled){background:#fff;}
  .ask button:disabled{opacity:.5;cursor:default;}
  .note{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-top:12px;}
  .status{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);margin:24px 0;display:none;}
  .status.on{display:block;}
  .out{text-align:left;max-width:820px;margin:0 auto;}
  .round-label{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:30px 0 14px;display:flex;align-items:center;gap:12px;}
  .round-label::after{content:"";flex:1;height:1px;background:var(--line);}
  .member{border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:12px;background:var(--surface);}
  .member .who{font-family:var(--f-display);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:9px;margin-bottom:4px;}
  .member .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor;}
  .member .lbl{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
  .member p{font-size:.98rem;white-space:pre-wrap;color:var(--text);}
  .member .rev{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);color:var(--muted);font-size:.92rem;}
  .verdict{border:1.5px solid var(--accent);border-radius:6px;padding:26px 24px;margin:20px 0 40px;
    background:var(--surface);box-shadow:0 0 34px rgba(255,62,108,.22);}
  .verdict .cap{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
  .verdict h3{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin-bottom:12px;letter-spacing:-.01em;}
  .verdict p{white-space:pre-wrap;color:var(--text);}
  .member .role{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:8px;}
  .vsec{margin-bottom:16px;}
  .vlabel{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;}
  .final-answer{font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:1.35;color:var(--text);letter-spacing:-.01em;white-space:pre-wrap;}
  .vcheck{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-family:var(--f-mono);font-size:.72rem;color:var(--muted);line-height:1.6;word-break:break-word;}
  .err{color:var(--accent);font-family:var(--f-mono);font-size:.85rem;margin:20px 0;text-align:center;}
  @media (prefers-reduced-motion: reduce){ .tri-line,.tri-wrap::before{animation:none;} }
</style>
</head>
<body>
<nav>
  <div class="wrap nav-in">
    <a href="index.html" class="brand">council</a>
    <a href="signup.html" class="nav-cta">Log in / Sign up</a>
  </div>
</nav>

<div class="wrap">
  <section class="stage">
    <div class="eyebrow">three minds · one verdict</div>
    <div class="tri-wrap">
      <svg class="triangle" viewBox="0 0 440 410" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="triGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FF3E6C"/>
            <stop offset="50%" stop-color="#8B5CF6"/>
            <stop offset="100%" stop-color="#22D3EE"/>
          </linearGradient>
        </defs>
        <path class="tri-line" d="M220,55 L60,345 L380,345 Z"/>
        <g class="node node-gpt">
          <circle cx="220" cy="55" r="9"/>
          <text x="220" y="34" text-anchor="middle">ChatGPT</text>
        </g>
        <g class="node node-claude">
          <circle cx="60" cy="345" r="9"/>
          <text x="60" y="378" text-anchor="middle">Claude</text>
        </g>
        <g class="node node-gemini">
          <circle cx="380" cy="345" r="9"/>
          <text x="380" y="378" text-anchor="middle">Gemini</text>
        </g>
      </svg>
    </div>
  </section>

  <section class="ask-area">
    <h2>Ask three AIs. Get one answer.</h2>
    <div class="ask">
      <input id="q" type="text" placeholder="Ask the council anything…" />
      <button id="go">Convene</button>
    </div>
    <div class="note">they answer, critique each other, then a chairman decides &amp; fact-checks it · ~20–40s</div>
    <div class="status" id="status"></div>
    <div class="out" id="out"></div>
  </section>
</div>

<script>
  const qEl = document.getElementById('q');
  const goEl = document.getElementById('go');
  const statusEl = document.getElementById('status');
  const outEl = document.getElementById('out');
  const palette = ['var(--gpt)','var(--claude)','var(--gemini)'];

  async function convene(){
    const q = qEl.value.trim();
    if(!q) return;
    goEl.disabled = true;
    outEl.innerHTML = '';
    statusEl.className = 'status on';
    statusEl.textContent = 'The council is in session…';
    try{
      const res = await fetch('/api/council', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ question:q })
      });
      const data = await res.json();
      if(data.error){ statusEl.className='status'; outEl.innerHTML = '<div class="err">'+data.error+'</div>'; return; }
      render(data);
    }catch(e){
      outEl.innerHTML = '<div class="err">Could not reach the council. Try again.</div>';
    }finally{
      goEl.disabled = false;
      statusEl.className = 'status';
    }
  }
  function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
  function render(data){
    let html = '<div class="round-label">The panel</div>';
    (data.members||[]).forEach((m,i)=>{
      const col = palette[i]||'var(--muted)';
      html += '<div class="member">'
        + '<div class="role" style="color:'+col+'">'+esc(m.role||'Panel member')+'</div>'
        + '<div class="who"><span class="dot" style="background:'+col+';color:'+col+'"></span>'+esc(m.name)+'</div>'
        + '<p>'+esc(m.answer)+'</p>'
        + '</div>';
    });
    const c = data.chairman||{};
    html += '<div class="verdict"><div class="cap">The verdict</div>';
    if(c.whyListen){ html += '<div class="vsec"><div class="vlabel">Why listen to '+esc(c.strongest||'the strongest voice')+'</div><p>'+esc(c.whyListen)+'</p></div>'; }
    html += '<div class="vsec"><div class="vlabel">The answer</div><p class="final-answer">'+esc(c.finalAnswer||'')+'</p></div>';
    if(data.verificationText){ html += '<div class="vcheck">'+esc(data.verificationText)+'</div>'; }
    html += '</div>';
    outEl.innerHTML = html;
  }
  goEl.addEventListener('click', convene);
  qEl.addEventListener('keydown', e=>{ if(e.key==='Enter') convene(); });
</script>
</body>
</html>
